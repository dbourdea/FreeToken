name: FreeToken swap daemon

on:
  push:
    branches: [feat/freetoken-swap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freetoken-swap-daemon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon-linux:
    # This is a hosted, secret-free smoke lane. Never route pull-request code to
    # the repository's self-hosted engine builder or any protected runtime.
    if: github.repository == 'dbourdea/FreeToken'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install torch-free daemon test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pytest>=8,<9' \
            'fastapi>=0.115,<1' \
            'httpx>=0.27,<1' \
            'pydantic>=2.9,<3' \
            'uvicorn>=0.30,<1'
      - name: Run daemon suite, including disposable Linux child gates
        env:
          PYTHONPATH: python
        run: python -m pytest tests/daemon -q
