# Native freetoken-swap catalog. This is not a llama-swap YAML file.
#
# Migration: map each llama-swap models.<alias>.cmd to one native model path
# plus argv tokens. Map checkEndpoint /ready to the built-in readiness gate.
# Never paste shell fragments, ${PORT}, or command substitutions here. Set
# `port = 0` for a kernel-selected loopback port per native activation.

[router]
# Inference routes accept Bearer, a Basic-auth password, or `X-Api-Key` when
# this is nonempty. Router credentials are never forwarded to the engine.
api_keys = ["replace-with-a-secret"]
default_ttl_s = 300
unload_timeout_s = 30
upstream_timeout_s = 900
# Safe static suffixes that return 409 rather than cold-loading through
# /upstream/{model-id}/...; set [] to disable. No regex is accepted.
upstream_no_activation_suffixes = [".js", ".json", ".css", ".png", ".gif", ".jpg", ".jpeg", ".ico", ".txt"]
# Body-free activity rows are always bounded. Captures are sensitive, in-memory,
# credential-redacted, and opt-in; zero disables request/response retention.
activity_max_entries = 1000
capture_buffer_mb = 0
scheduler = "fifo"
# Zero disables the global cap. Every profile still has a default cap of 10.
global_concurrency_limit = 32
# Include alternate IDs in /v1/models. They remain routable when this is false.
include_aliases_in_list = true

[router.groups.interactive]
members = ["coding", "chat"]
swap = true
exclusive = true
persistent = false

[models.coding]
model = "/models/coding.gguf"
# Slash-namespaced IDs are valid; every segment uses letters, digits, `.`, `_`, or `-`.
aliases = ["coding-compatible", "local/coding-compatible"]
port = 1919
args = ["--served-model-name", "coding", "--max-seq-len-override", "32768"]
ready_timeout_s = 300
ttl_s = 0
priority = 10
concurrency_limit = 2
group = "interactive"
# Optional narrow compatibility filter. It removes only named top-level JSON
# fields from requests for this profile. `model` can never be removed.
drop_fields = ["metadata"]

[models.chat]
model = "/models/chat.gguf"
# Hidden profiles remain routable and manageable but are omitted from /v1/models,
# along with all of their aliases.
unlisted = true
port = 1919
args = ["--served-model-name", "chat", "--max-seq-len-override", "16384"]
ready_timeout_s = 300
priority = 0
concurrency_limit = 4
group = "interactive"
